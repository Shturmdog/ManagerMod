[project]
name = "managermod"
version = "0.1.0"
description = "Restaurant management system"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=packages/core --cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["packages/core", "app"]
omit = ["*/tests/*", "*/__init__.py"]